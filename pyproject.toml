[project]
name = "western-hognose"
version = "0.1.0"
description = "Reusable helper utilities"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disk_dict.py", "src/output_file.py", "src/cached_get_json.py"]
